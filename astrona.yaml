          - name: "Workspaces"
            url: https://tekton.dev/docs/pipelines/workspaces/
      - type: reading
        title: Summary
        path: sections/section-030/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-030/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair A Broken CI Pipeline Capstone"
        path: sections/section-030/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 45m
        topic: ci-pipeline
        task_kind: troubleshooting
        tags: [cluster-resolver, matrix, when-expressions, finally, notifications, conditional-deploy, image-build]
        learning_goals:
          - Find why a CI PipelineRun fails or misbehaves from its condition, its skipped tasks and its TaskRuns
