# Course manifest for ATS126 - Pipelines, Task Graphs & Custom Tasks (Tekton).
#
# One entry per module under `modules:`, in section order. A module lists,
# in order: the section README when it opens a section, its landing page
# (course.md), its parts (course-0N-*.md), and right after the part a lab
# tests, the lab's question.md reading and the `type: lab` entry. The
# module's summary page and knowledge check come last. The last module of a
# section also carries the section capstone and the section knowledge check.
# Playgrounds are not listed: the playground marker on the landing page shows
# them. solution.md is never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS126
  title: "Tekton: Pipelines, Task Graphs & Custom Tasks"
  maturity: alpha
  description: >
    Training material covering the Pipelines, Task Graphs & Custom Tasks
    domain of the Tekton training path: Pipeline and PipelineRun
    specifications, parameters and workspaces, building a directed acyclic
    graph of Tasks with runAfter and result references, pipeline results and
    the status of a PipelineRun, conditional execution with when expressions
    (and CEL behind its feature flag), finally tasks and execution status,
    timeouts, retries and onError, matrix fan-out, custom tasks and remote
    resolution, and an end-to-end CI pipeline that clones from an in-cluster
    Git server, lints, tests on two images, scans, builds and pushes an image
    with kaniko, deploys only from main and reports its status from a finally
    task. Deeper modules cover typed parameters, context variables and
    workspace volume sources, cancelling and stopping runs, cluster defaults,
    service accounts and resource overrides, credentials for registries and
    Git, and the cluster, git and http resolvers. Each module pairs a layered reader with an ungraded hands-on
    playground and a graded practice lab. Each section closes with an
    integration capstone. Written for Tekton Pipelines v1.17.1 and tkn
    v0.46.2.

  certification:
    name: Tekton
    code: TEKTON
    provider: Astrona

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
