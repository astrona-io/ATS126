        path: sections/section-030/module-01/course-02-custom-tasks-and-remote-resolution.md
      - type: reading
        title: "Design An End-To-End CI Pipeline"
        path: sections/section-030/module-01/course-03-design-an-end-to-end-ci-pipeline.md
      - type: reading
        title: Question
