        title: "Build An End-To-End CI Pipeline Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 45m
        topic: ci-pipeline
        task_kind: build
        tags: [matrix, git-clone, unit-tests, security-scan, image-build, conditional-deploy, notifications, dag]
        learning_goals:
          - Build a CI Pipeline that clones, lints, tests on two images with a matrix, scans, builds and pushes an image
          - Deploy only from main with a when expression and report every run from a finally task
