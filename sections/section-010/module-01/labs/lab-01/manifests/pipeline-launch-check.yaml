# The Pipeline the lab starts with. It has two faults:
#  - the pipeline task report refers to the result "manifest_id", but the
#    Task write-manifest publishes "manifest-id";
#  - the pipeline task count reads manifest.txt from the workspace but has no
#    edge to write, so both start at the same time.
# Fixing them is the task.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: launch-check
  namespace: starfleet
spec:
  params:
    - name: crew
      type: string
      default: "bridge scout shuttle"
    - name: release
      type: string
  workspaces:
    - name: shared
  results:
    - name: summary
      value: $(tasks.report.results.summary)
  tasks:
    - name: write
      taskRef:
        name: write-manifest
      params:
        - name: crew
          value: $(params.crew)
        - name: release
          value: $(params.release)
      workspaces:
        - name: shared
          workspace: shared
    - name: count
      taskRef:
        name: count-crew
      workspaces:
        - name: shared
          workspace: shared
    - name: report
      taskRef:
        name: report
      params:
        - name: manifest-id
          value: $(tasks.write.results.manifest_id)
        - name: count
          value: $(tasks.count.results.count)
