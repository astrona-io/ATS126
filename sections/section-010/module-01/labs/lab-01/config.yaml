# Fix The Task Graph Of A Pipeline
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-126-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-126-lab-010-01-setup"
      description: "Applies the Tasks, the Pipeline launch-check and the PipelineRun launch-check-run, and waits until the run has failed"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-launch-check-run"
      description: "Confirms launch-check-run uses the Pipeline launch-check, succeeded and reports summary 'r42-manifest: 3 crew ready'"
      type: "file"
      source: "validation/validate-launch-check-run.sh"
    - name: "validate-task-order"
      description: "Confirms count started after write finished, and report after both"
      type: "file"
      source: "validation/validate-task-order.sh"
    - name: "validate-grader-run"
      description: "Runs the Pipeline with four crew members and confirms the summary 'r7-manifest: 4 crew ready'"
      type: "file"
      source: "validation/validate-grader-run.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
