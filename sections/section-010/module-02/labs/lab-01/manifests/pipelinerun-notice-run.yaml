# The PipelineRun the lab starts with. It is correct; it fails because of the
# Pipeline.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: notice-run
  namespace: starfleet
spec:
  pipelineRef:
    name: notice
  params:
    - name: crew
      value:
        - bridge
        - scout
        - probe
    - name: release
      value:
        name: r9
        deck: "3"
