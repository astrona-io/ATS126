# The CI Tasks of the bridge application in starfleet. The build Task is not
# here: it lives in the shared namespace ci-catalog (ci-catalog.yaml).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: starfleet
spec:
  description: Clones one branch of a Git repository into the workspace output.
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  results:
    - name: commit
      description: The full commit hash that was cloned
    - name: short-commit
      description: The first 7 characters of the commit hash
  steps:
    - name: clone
      image: alpine/git:v2.49.1
      script: |
        #!/bin/sh
        set -eu
        cd "$(workspaces.output.path)"
        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" .
        commit="$(git rev-parse HEAD)"
        short="$(printf '%s' "$commit" | cut -c1-7)"
        printf '%s' "$commit" > "$(results.commit.path)"
        printf '%s' "$short" > "$(results.short-commit.path)"
        echo "Cloned $(params.revision) at $commit"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: shellcheck
  namespace: starfleet
spec:
  description: Runs ShellCheck on every shell script in the workspace.
  workspaces:
    - name: source
  results:
    - name: files
      description: How many scripts were checked
  steps:
    - name: shellcheck
      image: koalaman/shellcheck-alpine:v0.11.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        files="$(find . -name '*.sh' -not -path './.git/*' | sort)"
        echo "Checking:" $files
        printf '%s' "$(echo "$files" | wc -l | tr -d ' ')" > "$(results.files.path)"
        shellcheck $files
        echo "ShellCheck found no problems"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-test
  namespace: starfleet
spec:
  description: Runs test.sh with the shell of the image given in the parameter image.
  params:
    - name: image
      type: string
      description: The image whose shell runs the tests. No default on purpose.
  workspaces:
    - name: source
  results:
    - name: report
  steps:
    - name: test
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        sh ./test.sh
        printf 'passed on %s' "$(params.image)" | tee "$(results.report.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: secret-scan
  namespace: starfleet
spec:
  description: >
    A stand-in for a real security scanner. It looks for lines that assign a
    value to a password, token or secret, and fails if it finds any.
  workspaces:
    - name: source
  results:
    - name: findings
      description: How many suspicious lines were found
  steps:
    - name: scan
      image: busybox:1.37.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        # Every file except the .git folder, with file name and line number.
        matches="$(find . -path ./.git -prune -o -type f -exec grep -HniE '(password|token|secret)[[:space:]]*=' {} + || true)"
        count=0
        if [ -n "$matches" ]; then
          count="$(printf '%s\n' "$matches" | wc -l | tr -d ' ')"
        fi
        printf '%s' "$count" > "$(results.findings.path)"
        if [ "$count" -gt 0 ]; then
          printf '%s\n' "$matches"
          echo "Found $count possible secrets" >&2
          exit 1
        fi
        echo "No secrets found"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
  namespace: starfleet
spec:
  description: >
    Records the release in the ConfigMap bridge-release. It stands in for a
    real rollout, which would update a Deployment or a GitOps repository.
  params:
    - name: image-url
      type: string
    - name: image-digest
      type: string
    - name: commit
      type: string
  steps:
    - name: record-release
      image: alpine/kubectl:1.34.2
      script: |
        #!/bin/sh
        set -eu
        kubectl create configmap bridge-release \
          --from-literal=image="$(params.image-url)" \
          --from-literal=digest="$(params.image-digest)" \
          --from-literal=commit="$(params.commit)" \
          --dry-run=client -o yaml > /tmp/bridge-release.yaml
        kubectl apply -f /tmp/bridge-release.yaml
        echo "Released $(params.image-url)@$(params.image-digest)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: notify
  namespace: starfleet
spec:
  description: >
    Writes the outcome of a PipelineRun to the ConfigMap
    ci-notification-<pipelinerun>. It stands in for a chat or email message.
  params:
    - name: pipelinerun
      type: string
    - name: branch
      type: string
    - name: status
      type: string
      description: The aggregate status of the tasks
    - name: deploy-status
      type: string
    - name: detail
      type: string
      default: ""
  steps:
    - name: notify
      image: alpine/kubectl:1.34.2
      script: |
        #!/bin/sh
        set -eu
        kubectl create configmap "ci-notification-$(params.pipelinerun)" \
          --from-literal=branch="$(params.branch)" \
          --from-literal=status="$(params.status)" \
          --from-literal=deploy="$(params.deploy-status)" \
          --from-literal=detail="$(params.detail)" \
          --dry-run=client -o yaml > /tmp/notification.yaml
        kubectl apply -f /tmp/notification.yaml
        echo "$(params.pipelinerun) on $(params.branch): $(params.status), deploy $(params.deploy-status)"
