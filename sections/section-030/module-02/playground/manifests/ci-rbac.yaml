# The ServiceAccount ci-bot runs the CI TaskRuns. The Tasks deploy and notify
# write ConfigMaps in starfleet, so ci-bot may manage ConfigMaps there, and
# nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bot
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-bot
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-bot
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: ci-bot
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-bot
