apiVersion: v1
kind: Namespace
metadata:
  name: ci-catalog
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: announce
  namespace: ci-catalog
spec:
  params:
    - name: message
      type: string
  results:
    - name: line
  steps:
    - name: announce
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        echo "announce: $(params.message)" | tee $(results.line.path)
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-flow
  namespace: ci-catalog
spec:
  params:
    - name: target
      type: string
      default: dev
  results:
    - name: summary
      value: $(tasks.plan.results.summary)
  tasks:
    - name: plan
      params:
        - name: target
          value: $(params.target)
      taskSpec:
        params:
          - name: target
        results:
          - name: summary
        steps:
          - name: plan
            image: busybox:1.37.0
            script: |
              #!/bin/sh
              echo "deploy $(params.target)" | tee $(results.summary.path)
