# Final domain quiz. Listed in astrona.yaml as the last `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats126-final
course_id: ATS126
exam_code: TEKTON
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: pipelines-task-graphs-custom-tasks
  title: 'Tekton: Pipelines, Task Graphs & Custom Tasks'
questions:
- id: ats126-final-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Tell which links order the tasks of a Pipeline
  source_readings:
  - sections/section-010/module-01/course-03-order-tasks-into-a-graph.md
  prompt: The pipeline tasks `writer` and `reader` use the same workspace. `writer`
    writes a file and `reader` reads it. Neither has `runAfter` and neither uses a
    result of the other. What does Tekton do?
  options:
  - id: a
    text: It starts both at the same time, so `reader` may look before `writer` has
      written.
    explanation: Correct. A shared workspace is not an edge of the graph. Only `runAfter`
      and result references are.
  - id: b
    text: It starts them in the order of `spec.tasks`.
    explanation: Not correct. The order in `spec.tasks` means nothing. Only the edges
      count.
  - id: c
    text: It starts `writer` first, because the workspace is shared.
    explanation: Not correct. A shared workspace does not order tasks.
  - id: d
    text: It rejects the Pipeline when you apply it.
    explanation: Not correct. The webhook accepts this Pipeline. The fault shows at
      run time.
  correct_option: a
  explanation: Correct. A shared workspace is not an edge of the graph. Only `runAfter`
    and result references are.
- id: ats126-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Write a result reference between pipeline tasks
  source_readings:
  - sections/section-010/module-01/course-02-results-between-tasks.md
  prompt: The pipeline task `pick` runs the Task `pick-crew`, which has the result
    `captain`. Which reference gives that result to another pipeline task?
  options:
  - id: a
    text: "`$(tasks.pick-crew.results.captain)`"
    explanation: Not correct. `pick-crew` is the Task name. The reference uses the
      pipeline task name.
  - id: b
    text: "`$(tasks.pick.results.captain)`"
    explanation: Correct. The first name is the pipeline task name, not the Task name.
  - id: c
    text: "`$(pick.results.captain)`"
    explanation: Not correct. The reference must start with `tasks.`.
  - id: d
    text: "`$(results.captain)`"
    explanation: Not correct. `$(results.captain.path)` is used inside the Task to
      write the result, not to read it.
  correct_option: b
  explanation: Correct. The first name is the pipeline task name, not the Task name.
- id: ats126-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the failure of a misspelled result reference
  source_readings:
  - sections/section-010/module-01/course-02-results-between-tasks.md
  prompt: A PipelineRun refers to `$(tasks.pick.results.capitan)`, but the Task `pick-crew`
    only has the result `captain`. What do you see?
  options:
  - id: a
    text: "`kubectl apply` is rejected by the webhook."
    explanation: Not correct. The webhook only checks that the pipeline task `pick`
      exists.
  - id: b
    text: The `pick` TaskRun fails and its pod log shows the error.
    explanation: Not correct. The run fails before any TaskRun and pod exist, so there
      is no log.
  - id: c
    text: The run fails with the reason `InvalidTaskResultReference` and no TaskRun
      exists.
    explanation: Correct. The controller loads the Task and checks the result name
      before it creates any TaskRun.
  - id: d
    text: The run succeeds and the parameter is an empty string.
    explanation: Not correct. An unresolvable reference fails the run. It never becomes
      an empty string.
  correct_option: c
  explanation: Correct. The controller loads the Task and checks the result name before
    it creates any TaskRun.
- id: ats126-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict which tasks run after a skipped task
  source_readings:
  - sections/section-020/module-01/course-01-guard-tasks-with-when.md
  prompt: "`deploy` is skipped by its `when` expression. `smoke` has only `runAfter:
    [deploy]`. `announce` uses `$(tasks.deploy.results.url)`. What happens to them?"
  options:
  - id: a
    text: Both run, and `announce` gets an empty `url`.
    explanation: Not correct. `announce` needs a result that does not exist, so it
      is skipped.
  - id: b
    text: Both are skipped, because `deploy` was skipped.
    explanation: Not correct. `runAfter` alone does not skip `smoke`.
  - id: c
    text: "`smoke` is skipped and `announce` runs."
    explanation: Not correct. The two tasks behave the other way round.
  - id: d
    text: "`smoke` runs. `announce` is skipped with the reason `Results were missing`."
    explanation: Correct. A skipped task stops only the tasks that need its results.
  correct_option: d
  explanation: Correct. A skipped task stops only the tasks that need its results.
- id: ats126-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain how a retry is recorded
  source_readings:
  - sections/section-020/module-01/course-03-timeouts-retries-and-onerror.md
  prompt: 'A pipeline task has `retries: 2`. Its first attempt fails and the second
    attempt succeeds. What do you find?'
  options:
  - id: a
    text: One TaskRun, the failed attempt in `status.retriesStatus`, and a second
      pod ending in `-retry1`.
    explanation: Correct. The controller keeps the same TaskRun and starts a new pod
      for each retry.
  - id: b
    text: One TaskRun and one pod, because the pod is restarted.
    explanation: Not correct. Each attempt gets its own pod.
  - id: c
    text: Two TaskRuns, one for each attempt.
    explanation: Not correct. A retry reuses the TaskRun.
  - id: d
    text: 'Three TaskRuns, because `retries: 2` always runs three attempts.'
    explanation: Not correct. The third attempt is only started when the second one
      fails.
  correct_option: a
  explanation: Correct. The controller keeps the same TaskRun and starts a new pod
    for each retry.
- id: ats126-final-q06
  type: single_choice
  difficulty: advanced
  learning_objective: Set timeouts that fit together
  source_readings:
  - sections/section-020/module-01/course-03-timeouts-retries-and-onerror.md
  prompt: 'A PipelineRun sets `timeouts.tasks: 2m` and `timeouts.finally: 1m`. Which
    value of `timeouts.pipeline` is valid and leaves time for `finally`?'
  options:
  - id: a
    text: "`2m`, because `pipeline` must equal `tasks`."
    explanation: Not correct. With `2m` no time is left for `finally`.
  - id: b
    text: "`3m`, because `pipeline` must be at least `tasks` plus `finally`."
    explanation: Correct. `timeouts.pipeline` covers the tasks and the `finally` tasks
      together.
  - id: c
    text: "`1m`, because `pipeline` is the shortest limit."
    explanation: Not correct. `1m` is shorter than `tasks`. The three values do not
      fit.
  - id: d
    text: "`90s`, because `finally` runs inside `tasks`."
    explanation: Not correct. `finally` does not run inside `tasks`. Its time is added.
  correct_option: b
  explanation: Correct. `timeouts.pipeline` covers the tasks and the `finally` tasks
    together.
- id: ats126-final-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Count the TaskRuns of a matrix with include
  source_readings:
  - sections/section-030/module-01/course-01-fan-out-with-a-matrix.md
  prompt: A pipeline task has `matrix.params` with two crew names and two images.
    `matrix.include` adds one entry with a crew name that is not in the list. How
    many TaskRuns does Tekton create?
  options:
  - id: a
    text: Four. `include` changes one of the four.
    explanation: Not correct. An `include` entry is added to existing combinations
      only when it adds a parameter and no value clashes.
  - id: b
    text: Two. The lists are matched by position.
    explanation: Not correct. Tekton builds every combination of the lists.
  - id: c
    text: 'Five: four combinations plus one for the `include` entry.'
    explanation: Correct. The entry has a value no combination has, so it becomes
      a combination of its own.
  - id: d
    text: Three. Only the distinct crew names count.
    explanation: Not correct. Images and crew names multiply. They are not counted
      apart.
  correct_option: c
  explanation: Correct. The entry has a value no combination has, so it becomes a
    combination of its own.
- id: ats126-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Pin a Task fetched by the git resolver
  source_readings:
  - sections/section-030/module-01/course-02-custom-tasks-and-remote-resolution.md
  prompt: 'A team uses the git resolver with `revision: main`. They need the same
    Task version in every run. What should they do?'
  options:
  - id: a
    text: Keep `main`, because a branch name never changes.
    explanation: Not correct. A branch moves with every new commit.
  - id: b
    text: Switch to a `name` and `resolver` in the same `taskRef`.
    explanation: Not correct. A `taskRef` uses `name` or `resolver`, not both.
  - id: c
    text: Set `pathInRepo` to a directory.
    explanation: Not correct. `pathInRepo` selects the file, not the version.
  - id: d
    text: Set `revision` to a commit hash.
    explanation: Correct. A branch name points to whatever the branch has when the
      run starts.
  correct_option: d
  explanation: Correct. A branch name points to whatever the branch has when the run
    starts.
- id: ats126-final-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Read the notification of a feature branch run
  source_readings:
  - sections/section-030/module-01/course-03-design-an-end-to-end-ci-pipeline.md
  prompt: The CI run on `feature/banner` skips `deploy` with its `when` expression.
    The checks and the build succeed. What does the `finally` task `notify` receive
    as `$(tasks.status)` and `$(tasks.deploy.status)`?
  options:
  - id: a
    text: "`Completed` and `None`."
    explanation: Correct. Something was skipped, so the aggregate is `Completed`.
      A skipped task has the status `None`.
  - id: b
    text: "`Succeeded` and `Succeeded`."
    explanation: Not correct. That is what a run on `main` shows, when `deploy` ran.
  - id: c
    text: "`Failed` and `Failed`."
    explanation: Not correct. Nothing failed in this run.
  - id: d
    text: "`Completed` and `Failed`."
    explanation: Not correct. A skipped task is `None`, not `Failed`.
  correct_option: a
  explanation: Correct. Something was skipped, so the aggregate is `Completed`. A
    skipped task has the status `None`.
