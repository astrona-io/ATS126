# The Tasks of the nightly Pipeline. They are correct; the faults are in the
# Pipeline.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: warm-cache
  namespace: starfleet
spec:
  steps:
    - name: download
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        # The first attempt of every run fails, like a mirror that answers
        # only after a first request has woken it up. A retry runs in a new
        # pod whose name ends in -retry1, -retry2 and so on. The pod name is
        # in HOSTNAME. ($(context.task.retry-count) stays 0 in a Task used
        # through taskRef in Tekton Pipelines v1.17.1, so it is not used here.)
        echo "Running in pod $HOSTNAME"
        case "$HOSTNAME" in
          *-retry[0-9]*) echo "The cache is warm" ;;
          *) echo "The cache mirror did not answer" >&2; exit 1 ;;
        esac
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: integration
  namespace: starfleet
spec:
  params:
    - name: break
      type: string
      default: "false"
      description: Set to "true" to make the tests fail on purpose
  results:
    - name: summary
  steps:
    - name: test
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        set -eu
        echo "Running the integration tests (about 20 seconds)"
        sleep 20
        if [ "$(params.break)" = "true" ]; then
          echo "3 tests failed" >&2
          exit 1
        fi
        printf '42 tests passed' | tee "$(results.summary.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: docs-check
  namespace: starfleet
spec:
  steps:
    - name: links
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        # A known problem: one external link is broken, and the team has
        # decided that this must not stop the nightly run.
        echo "1 external link is broken" >&2
        exit 1
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: report
  namespace: starfleet
spec:
  params:
    - name: integration
      type: string
    - name: docs
      type: string
  results:
    - name: message
  steps:
    - name: report
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        set -eu
        printf 'integration=%s docs=%s' "$(params.integration)" "$(params.docs)" | tee "$(results.message.path)"
